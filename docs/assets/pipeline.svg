    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18231e"/><stop offset="1" stop-color="#29352e"/></linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ee6a3a"/><stop offset="1" stop-color="#f2b07b"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#88ae91"/><stop offset="1" stop-color="#c0d4b9"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#9aa99d"/></marker>
  </defs>
  <rect width="1200" height="430" rx="20" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
