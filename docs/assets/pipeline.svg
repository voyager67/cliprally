<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">ClipRally long-video to short-clips workflow</title>
  <desc id="desc">A long recording is analysed through speech transcription and visual motion detection. Candidate timestamps are ranked, selected, reframed and exported as captioned vertical MP4 clips.</desc>
