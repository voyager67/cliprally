<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 190" role="img" aria-labelledby="title desc">
  <title id="title">ClipRally processing pipeline</title>
  <desc id="desc">A source video is transcribed and ranked, then reframed and rendered as vertical short-form clips.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#202f46"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#52d6b5"/><stop offset="1" stop-color="#66a8ff"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#8da6c4"/></marker>
  </defs>
  <rect width="1120" height="190" rx="18" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#f5f8ff">
    <text x="30" y="35" font-size="13" letter-spacing="2" fill="#8ea6c6">LOCAL-FIRST VIDEO → SHORTS PIPELINE</text>
    <g transform="translate(28 58)">
      <rect width="178" height="94" rx="12" fill="#263c57" stroke="#48627f"/>
      <rect x="16" y="18" width="58" height="42" rx="5" fill="#17283d" stroke="#81a6d6"/>
      <path d="M39 28 L39 50 L57 39 Z" fill="#8fd9cb"/>
      <text x="88" y="37" font-size="15" font-weight="700">Source</text>
      <text x="88" y="57" font-size="11" fill="#b8c8dc">Local file / URL</text>
    </g>
    <path d="M213 105 H244" stroke="#8da6c4" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(252 58)">
      <rect width="178" height="94" rx="12" fill="#263c57" stroke="#48627f"/>
      <path d="M18 27 H65 M18 39 H53 M18 51 H61" stroke="#8fd9cb" stroke-width="3" stroke-linecap="round"/>
      <text x="82" y="37" font-size="15" font-weight="700">Transcribe</text>
      <text x="82" y="57" font-size="11" fill="#b8c8dc">Word timestamps</text>
    </g>
    <path d="M437 105 H468" stroke="#8da6c4" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(476 58)">
      <rect width="178" height="94" rx="12" fill="#263c57" stroke="#48627f"/>
      <path d="M18 24 H65 M18 36 H58 M18 48 H64 M18 60 H51" stroke="#8fd9cb" stroke-width="3" stroke-linecap="round"/>
      <text x="82" y="37" font-size="15" font-weight="700">Rank</text>
      <text x="82" y="57" font-size="11" fill="#b8c8dc">Best moments</text>
    </g>
    <path d="M661 105 H692" stroke="#8da6c4" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(700 58)">
      <rect width="178" height="94" rx="12" fill="#263c57" stroke="#48627f"/>
      <rect x="20" y="15" width="28" height="55" rx="5" fill="#17283d" stroke="#8fd9cb" stroke-width="2"/>
      <rect x="25" y="38" width="18" height="15" rx="2" fill="#6aaaff"/>
      <text x="65" y="37" font-size="15" font-weight="700">Reframe</text>
      <text x="65" y="57" font-size="11" fill="#b8c8dc">9:16 + captions</text>
    </g>
    <path d="M885 105 H916" stroke="#8da6c4" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(924 58)">
      <rect width="168" height="94" rx="12" fill="#183f43" stroke="#52d6b5"/>
      <rect x="18" y="16" width="34" height="58" rx="5" fill="#0d282e" stroke="#77e0c6"/>
      <path d="M23 54 H47 M23 59 H43" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="65" y="37" font-size="15" font-weight="700">Shorts out</text>
      <text x="65" y="57" font-size="11" fill="#c0eee5">MP4 + manifest</text>
    </g>
  </g>
  <rect x="30" y="166" width="1062" height="3" rx="2" fill="url(#accent)" opacity=".9"/>
</svg>